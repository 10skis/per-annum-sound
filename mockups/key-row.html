<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Key Row Options</title>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Saira+Condensed:wght@500;600&family=VT323&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0b0906; --amber: #ffb02e; --amber-mid: #d08c26; --amber-dim: #9c6c22; --amber-ghost: #241907; --line: #4a3616;
          --dot: "VT323", monospace; --glow-soft: #ffb02e5c; }
  body { margin: 0; background: var(--bg); color: var(--amber-mid); font-family: "Saira Condensed", sans-serif; padding: 28px 16px;
         background-image: radial-gradient(#ffb02e0c 1px, transparent 1.2px); background-size: 7px 7px; }
  h1 { font: 400 16px "Michroma", sans-serif; letter-spacing: .2em; color: var(--amber); margin: 0 0 6px; }
  p.lead { color: var(--amber-dim); margin: 0 0 24px; font-size: 17px; max-width: 760px; }
  .row { display: flex; flex-wrap: wrap; gap: 40px; }
  .opt { width: 343px; }
  .opt h2 { font-weight: 600; font-size: 18px; letter-spacing: .12em; text-transform: uppercase; color: var(--amber); margin: 0 0 4px; }
  .opt .why { color: var(--amber-dim); font-size: 16px; margin: 0 0 16px; min-height: 3.6em; }
  .stack { display: grid; gap: 12px; }

  /* The app's own key styles, copied */
  .cham { --cut: 7px; --edge: var(--amber-dim);
    clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut));
    background-image:
      linear-gradient(135deg, transparent 50%, var(--edge) 50%, var(--edge) calc(50% + 1.5px), transparent calc(50% + 1.5px)),
      linear-gradient(315deg, transparent 50%, var(--edge) 50%, var(--edge) calc(50% + 1.5px), transparent calc(50% + 1.5px));
    background-position: top left, bottom right; background-size: var(--cut) var(--cut); background-repeat: no-repeat; }
  .key, .ps > span { height: 48px; border: 1px solid var(--amber-dim); font: 24px var(--dot); letter-spacing: .06em; color: var(--amber-mid);
                     display: grid; place-items: center; background-color: transparent; }
  .ps > span.on { background-color: var(--amber); color: var(--bg); border-color: var(--amber); box-shadow: 0 0 12px var(--glow-soft); }
  .ps { display: grid; grid-template-columns: 1fr 1fr; }
  .ps > span + span { border-left: 0; }
  .tl { --edge: var(--amber-dim); clip-path: polygon(7px 0, 100% 0, 100% 100%, 0 100%, 0 7px);
        background-image: linear-gradient(135deg, transparent 50%, var(--edge) 50%, var(--edge) calc(50% + 1.5px), transparent calc(50% + 1.5px));
        background-position: top left; background-size: 7px 7px; background-repeat: no-repeat; }
  .br { --edge: var(--amber-dim); clip-path: polygon(0 0, 100% 0, 100% calc(100% - 7px), calc(100% - 7px) 100%, 0 100%);
        background-image: linear-gradient(315deg, transparent 50%, var(--edge) 50%, var(--edge) calc(50% + 1.5px), transparent calc(50% + 1.5px));
        background-position: bottom right; background-size: 7px 7px; background-repeat: no-repeat; }
  .on.br, .on.tl { --edge: var(--amber); }
  /* C: the shuffle key mirrored, cut top-right and bottom-left, so its top-right cut meets PLAY's top-left */
  .mirror { --edge: var(--amber-dim);
    clip-path: polygon(0 0, calc(100% - 7px) 0, 100% 7px, 100% 100%, 7px 100%, 0 calc(100% - 7px));
    background-image:
      linear-gradient(225deg, transparent 50%, var(--edge) 50%, var(--edge) calc(50% + 1.5px), transparent calc(50% + 1.5px)),
      linear-gradient(45deg, transparent 50%, var(--edge) 50%, var(--edge) calc(50% + 1.5px), transparent calc(50% + 1.5px));
    background-position: top right, bottom left; background-size: 7px 7px; background-repeat: no-repeat; }

  .ps-row { display: grid; grid-template-columns: 72px 1fr; gap: 6px; }
  .bar { display: grid; grid-template-columns: 72px 1fr 1fr; }  /* B: one key in three parts */
  .bar > * + * { border-left: 0; }
  .tuner { display: grid; grid-template-columns: 64px 1fr 64px; gap: 10px; }
  .tuner .key { font-size: 26px; color: var(--amber); }
  .read { height: 48px; border: 1px solid var(--line); display: flex; align-items: baseline; justify-content: center; gap: 4px; font-family: var(--dot); color: var(--amber); }
  .read b { font: 400 38px/48px var(--dot); text-shadow: 0 0 6px #ffb02e88; } .read span { font-size: 18px; color: var(--amber-dim); }
  .read.cham { --cut: 8px; --edge: var(--line); }
  .presets { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .presets div { height: 52px; border: 1px solid var(--amber-dim); display: grid; place-items: center; font: 24px var(--dot); color: var(--amber-mid); }
  .presets div.empty { border-style: dashed; --edge: var(--line); }
  svg { display: block; }
</style>
</head>
<body>
<h1>KEY ROW</h1>
<p class="lead">At phone width, with the presets above and the tuner below for context. A is today: the shuffle key on its own, the same corners cut as every other key. C is your mirrored shuffle key. B joins shuffle, PLAY and STOP into one bar cut at its two outer corners.</p>
<div class="row" id="row"></div>
<template id="tpl">
  <div class="opt"><h2></h2><div class="why"></div>
    <div class="stack">
      <div class="presets"><div class="cham">1</div><div class="cham">2</div><div class="cham empty">3</div><div class="cham empty">4</div><div class="cham empty">5</div><div class="cham empty">6</div></div>
      <div class="slot"></div>
      <div class="tuner"><div class="key cham">◀</div><div class="read cham"><b>01</b><span>/66</span></div><div class="key cham">▶</div></div>
    </div>
  </div>
</template>
<script>
const SHUFFLE = '<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 7h5l10 10h4M2 17h5l3-3M14 10l3-3h4M18 4l3 3-3 3M18 14l3 3-3 3"/></svg>';
const OPTS = [
  { name: "A · Today", why: "Shuffle is its own key with both corners cut, like the tuner row below.",
    html: `<div class="ps-row"><div class="key cham">${SHUFFLE}</div><div class="ps"><span class="tl">PLAY</span><span class="br on">STOP</span></div></div>` },
  { name: "C · Mirrored shuffle", why: "Shuffle cut at the top-right and bottom-left, so its notch faces PLAY's. The only key flipped.",
    html: `<div class="ps-row"><div class="key mirror">${SHUFFLE}</div><div class="ps"><span class="tl">PLAY</span><span class="br on">STOP</span></div></div>` },
  { name: "B · One bar", why: "Shuffle, PLAY and STOP as one key in three parts: shuffle takes the top-left cut, STOP the bottom-right.",
    html: `<div class="bar ps"><span class="tl">${SHUFFLE}</span><span>PLAY</span><span class="br on">STOP</span></div>` },
  { name: "B · One bar, playing", why: "The same bar with PLAY lit, to see the square middle when it's filled.",
    html: `<div class="bar ps"><span class="tl">${SHUFFLE}</span><span class="on">PLAY</span><span class="br">STOP</span></div>` },
];
for (const o of OPTS) {
  const el = document.getElementById("tpl").content.cloneNode(true);
  el.querySelector("h2").textContent = o.name; el.querySelector(".why").textContent = o.why;
  el.querySelector(".slot").outerHTML = o.html;
  document.getElementById("row").appendChild(el);
}
</script>
</body>
</html>
