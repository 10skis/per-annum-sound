<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Display Mode Options</title>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Saira+Condensed:wght@500;600&family=VT323&display=swap" rel="stylesheet">
<style>
  /* The real app (../app/web) in two frames, desktop and phone, with each option's CSS injected.
     Serve from projects/pi-radio: python3 -m http.server 8091, then /mockups/light-modes.html.
     Round 1 (v0.78 session) chose Solar over Paper and LCD, and BRT as the base for the dark mode. */
  :root { --bg: #0b0906; --amber: #ffb02e; --amber-mid: #d08c26; --amber-dim: #9c6c22; --line: #4a3616; }
  body { margin: 0; background: var(--bg); color: var(--amber-mid); font-family: "Saira Condensed", sans-serif; padding: 24px 16px; }
  h1 { font: 400 16px "Michroma", sans-serif; letter-spacing: .2em; color: var(--amber); margin: 0 0 6px; }
  p.lead { color: var(--amber-dim); margin: 0 0 18px; font-size: 17px; max-width: 900px; }
  .picks { display: flex; flex-wrap: wrap; gap: 28px; margin-bottom: 8px; align-items: center; }
  .picks div { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .picks span { font-weight: 600; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--amber-dim); margin-right: 4px; }
  button { font: 20px "VT323", monospace; color: var(--amber-mid); background: none; border: 1px solid var(--amber-dim); padding: 3px 10px; cursor: pointer; }
  button.on { background: var(--amber); color: var(--bg); border-color: var(--amber); }
  input[type=range] { width: 200px; accent-color: var(--amber); }
  output { font: 20px "VT323", monospace; color: var(--amber); width: 4ch; }
  .why { min-height: 2.6em; font-size: 17px; color: var(--amber); margin: 10px 0 16px; max-width: 900px; }
  .frames { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
  .desk { width: 1008px; height: 630px; overflow: hidden; border: 1px solid var(--line); }
  .desk iframe { width: 1440px; height: 900px; transform: scale(.7); transform-origin: 0 0; border: 0; }
  .phone { width: 375px; height: 812px; border: 1px solid var(--line); }
  .phone iframe { width: 375px; height: 812px; border: 0; }
  @media (max-width: 1100px) { .desk { width: 100%; height: 56vw; } .desk iframe { transform: scale(calc(1 / 1440 * 100vw * .9)); } }
</style>
</head>
<body>
<h1>DISPLAY MODES</h1>
<p class="lead">Three modes, dark to light, and one brightness slider for everything that carries information (lettering, lines, displays, art). Backgrounds stay put. Pick an Eclipse; the frames are live.</p>
<div class="picks">
  <div><span>Mode</span><button data-m="mk-lunar">LUNAR</button><button data-m="mk-eclipse-grey">ECLIPSE · GREY</button><button data-m="mk-eclipse-green">ECLIPSE · GREEN</button><button data-m="mk-solar">SOLAR</button></div>
  <div><span>Brightness</span><input type="range" id="lum" min="40" max="140" step="5" value="100"><output id="lumOut">100</output></div>
  <div><span>Now</span><button data-m="night">NGT</button></div>
</div>
<div class="why" id="why"></div>
<div class="frames">
  <div class="desk"><iframe id="fd" src="../app/web/index.html"></iframe></div>
  <div class="phone"><iframe id="fp" src="../app/web/index.html"></iframe></div>
</div>

<style id="variants">
  /* Mockup only: show the art and title as if playing, so options compare fairly without audio */
  .off img, .off .line, .off .detail, .off .sigil { opacity: 1 !important; }
  :root { --lum: 1; }
  .screen canvas:not(.sigil) { filter: brightness(var(--lum)); }
  .art img, .sigil { filter: brightness(var(--lum)) drop-shadow(0 0 2px var(--glow-soft)); }

  /* ---- LUNAR: the dark mode, from round 1's reworked BRT. Pure black, bright amber, strong
     glows, no vignette or scanlines. The slider takes it down for a dark room (old DSK). ---- */
  :root[data-theme="mk-lunar"] { --bg: #000; --screen: #000; --amber: #ffc24a; --amber-mid: #ffb43a; --amber-dim: #e0a040;
    --amber-ghost: #33240c; --line: #8a6428; --glow: #ffc24acc; --glow-soft: #ffc24a99; --texture: #ffc24a10; }
  [data-theme="mk-lunar"] .screen canvas:not(.sigil) { filter: brightness(calc(1.6 * var(--lum))) contrast(1.15); }
  [data-theme="mk-lunar"] .art img, [data-theme="mk-lunar"] .sigil { filter: brightness(calc(1.3 * var(--lum))) contrast(1.1) drop-shadow(0 0 3px var(--glow-soft)); }
  [data-theme="mk-lunar"] body::before, [data-theme="mk-lunar"] body::after { opacity: 0; }
  [data-theme="mk-lunar"] .ghost::before { color: #2a1d0a; }

  /* ---- ECLIPSE: the middle. A painted mid-dark chassis with cream lettering and amber accents;
     the displays stay dark glass, a step deeper than the chassis. Two candidates. ---- */
  :root[data-theme="mk-eclipse-grey"] { --bg: #34373a; --screen: #17191b; --amber: #ffb84a; --amber-mid: #e6dcc4; --amber-dim: #aaa597;
    --amber-ghost: #45484b; --line: #5c6064; --glow: #ffb84a55; --glow-soft: #ffb84a40; --texture: #e6dcc40d; --vignette: #00000040;
    --scanline: #00000014; --scrim: #34373aeb; }
  [data-theme="mk-eclipse-grey"] .ghost::before { color: #45484b; }
  [data-theme="mk-eclipse-grey"] .screen .ghost::before { color: #2a2c2e; }
  :root[data-theme="mk-eclipse-green"] { --bg: #2a3832; --screen: #121a16; --amber: #ffb84a; --amber-mid: #dfe2c6; --amber-dim: #a0ad96;
    --amber-ghost: #3a4a42; --line: #4f6358; --glow: #ffb84a55; --glow-soft: #ffb84a40; --texture: #dfe2c60d; --vignette: #00000040;
    --scanline: #00000014; --scrim: #2a3832eb; }
  [data-theme="mk-eclipse-green"] .ghost::before { color: #3a4a42; }
  [data-theme="mk-eclipse-green"] .screen .ghost::before { color: #22302a; }
  [data-theme^="mk-eclipse"] .screen canvas:not(.sigil) { filter: brightness(calc(1.2 * var(--lum))); }

  /* ---- SOLAR: Solarized light. base3 chassis, base2 glass, base01 lettering, Solarized orange as
     the accent. The displays turn light: dark ink on pale glass. Brightness before the invert, so
     a higher setting means darker, stronger ink. ---- */
  :root[data-theme="mk-solar"] { --bg: #fdf6e3; --amber: #cb4b16; --amber-mid: #586e75; --amber-dim: #657b83; --amber-ghost: #eee8d5;
    --line: #d3cbb4; --glow: #00000000; --glow-soft: #00000000; --texture: #586e7510; --vignette: #00000000; --scanline: #00000000;
    --scrim: #fdf6e3eb; --screen: #0b0906; }
  [data-theme="mk-solar"] .screen { background-color: #f1ebd9; }
  [data-theme="mk-solar"] .screen canvas, [data-theme="mk-solar"] .art img, [data-theme="mk-solar"] .sigil {
    filter: brightness(var(--lum)) invert(1) hue-rotate(180deg) sepia(.25) saturate(1.4) contrast(1.15); }
  [data-theme="mk-solar"] .ghost::before { color: #eee8d5; }
</style>
<script>
  const WHY = {
    night: "Night as it is now (Solarized dark), for reference. Lunar replaces it.",
    "mk-lunar": "Lunar: the dark mode, built on round 1's BRT. Slide down for a dark room, which covers what DSK did.",
    "mk-eclipse-grey": "Eclipse, grey: a graphite chassis with cream lettering and amber accents. Displays stay dark glass.",
    "mk-eclipse-green": "Eclipse, green: the same with a deep instrument green, a nod to the Solarized teal NGT had.",
    "mk-solar": "Solar: Solarized light. Everything goes light, displays included. Slide up for direct sun.",
  };
  // Information tokens the slider moves: below 100 they blend toward the background, above 100
  // toward the extreme (white on the dark modes, black on Solar). Backgrounds and glass don't move.
  const TOKENS = ["--amber", "--amber-mid", "--amber-dim", "--line"];
  const css = document.getElementById("variants").textContent;
  let mode = "mk-lunar", lum = 1;
  function apply(f) {
    const d = f.contentDocument; if (!d || !d.documentElement) return;
    if (!d.getElementById("mkv")) { const s = d.createElement("style"); s.id = "mkv"; s.textContent = css; d.head.appendChild(s); }
    const r = d.documentElement;
    TOKENS.forEach(t => r.style.removeProperty(t));
    r.dataset.theme = mode;
    const cs = getComputedStyle(r), bg = cs.getPropertyValue("--bg").trim(), peak = mode === "mk-solar" ? "#000" : "#fff";
    TOKENS.forEach(t => {
      const v = cs.getPropertyValue(t).trim();
      r.style.setProperty(t, lum <= 1 ? `color-mix(in srgb, ${v} ${Math.round(lum * 100)}%, ${bg})`
                                      : `color-mix(in srgb, ${v} ${Math.round((2 - lum) * 100)}%, ${peak})`);
    });
    r.style.setProperty("--lum", lum);
    const b = d.getElementById("modeBtn");
    if (b) b.textContent = { night: "NGT", "mk-lunar": "LUN", "mk-solar": "SOL" }[mode] || "ECL";
  }
  const all = () => ["fd", "fp"].forEach(id => apply(document.getElementById(id)));
  function pick(m) {
    mode = m; document.getElementById("why").textContent = WHY[m];
    document.querySelectorAll("[data-m]").forEach(b => b.classList.toggle("on", b.dataset.m === m));
    all();
  }
  document.querySelectorAll("[data-m]").forEach(b => b.onclick = () => pick(b.dataset.m));
  document.getElementById("lum").oninput = e => { lum = e.target.value / 100; document.getElementById("lumOut").textContent = e.target.value; all(); };
  ["fd", "fp"].forEach(id => { const f = document.getElementById(id); f.addEventListener("load", () => { apply(f); setTimeout(() => apply(f), 1500); }); });
  pick(mode);
</script>
</body>
</html>
