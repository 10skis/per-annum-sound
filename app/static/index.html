<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pi Radio</title>
<meta name="theme-color" content="#0b0906">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pi Radio">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0906;
    --amber: #ffb02e;
    --amber-mid: #d08c26;   /* ~7:1 on --bg */
    --amber-dim: #9c6c22;   /* ~4.5:1, the floor for small text */
    --amber-ghost: #241907;
    --line: #4a3616;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    --dot: "VT323", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }  /* class display rules would otherwise override it */
  html, body { margin: 0; background: var(--bg); color: var(--amber-mid); font-family: var(--mono); }
  body {
    min-height: 100vh;
    padding: max(20px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; align-items: center; gap: 20px;
  }
  body::after {
    /* scanlines over everything */
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 10;
    background: repeating-linear-gradient(0deg, #0000 0 2px, #0000002e 2px 3px);
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  .glow { color: var(--amber); text-shadow: 0 0 6px #ffb02e88; }

  .unit {
    width: 100%; max-width: 420px;
    border: 1px solid var(--line);
    padding: 16px;
    display: grid; gap: 16px;
    user-select: none; -webkit-user-select: none;
  }
  .head {
    display: flex; gap: 14px; align-items: baseline;
    font-family: var(--dot); font-size: 18px; color: var(--amber-dim); letter-spacing: .08em;
    border-bottom: 1px dashed var(--line); padding-bottom: 8px; margin: -4px 0 0;
  }
  .head .sig { flex: 1; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .head .clock { color: var(--amber-mid); }
  .head .clock i { font-style: normal; animation: blink 2s steps(1) infinite; }
  .label { font-size: 9px; letter-spacing: .2em; text-transform: uppercase; color: var(--amber-dim); }

  /* Keys row */
  .top { display: grid; grid-template-columns: 1fr 1fr 1.3fr; gap: 10px; }
  .key, .seg button {
    height: 48px; border: 1px solid var(--amber-dim);
    font-family: var(--dot); font-size: 24px; letter-spacing: .06em; color: var(--amber-mid);
    display: grid; place-items: center; position: relative;
    transition: background .08s, color .08s;
  }
  .key.on, .seg button.on { background: var(--amber); color: var(--bg); border-color: var(--amber); box-shadow: 0 0 12px #ffb02e55; }
  .key:active, .seg button:active { background: var(--amber-mid); color: var(--bg); }
  .seg { display: grid; grid-template-columns: 1fr 1fr; }
  .seg button + button { border-left: 0; }

  /* Output: the radio at home, or this phone */
  .out { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; }
  .out .seg button { height: 32px; font-size: 19px; }
  .static .out { display: none; }

  /* Dial + art */
  .mid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: center; }
  .dial-wrap { display: grid; justify-items: center; gap: 8px; }
  .dial {
    width: 100%; max-width: 160px; aspect-ratio: 1; position: relative;
    touch-action: none; cursor: grab; border-radius: 50%; outline: none;
    -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
  }
  .dial:active { cursor: grabbing; }
  .dial:focus-visible { box-shadow: 0 0 0 1px var(--amber-dim); }
  .dial i {
    position: absolute; left: 50%; top: 50%; width: 5px; height: 5px; margin: -2.5px;
    background: var(--amber-ghost);
  }
  .dial i.lit { background: var(--amber); box-shadow: 0 0 6px var(--amber); }
  .dial i.near { background: var(--amber-dim); }
  .dial-read {
    position: absolute; inset: 0; display: grid; place-content: center; text-align: center;
    font-family: var(--dot); pointer-events: none;
  }
  .dial-read b { font-weight: 400; font-size: 46px; line-height: .85; }
  .dial-read span { font-size: 16px; color: var(--amber-dim); }

  .screen { border: 1px solid var(--line); background: #070503; position: relative; }
  .art { aspect-ratio: 1; padding: 8px; }
  .art img {
    width: 100%; height: 100%; display: block;
    filter: drop-shadow(0 0 2px #ffb02e66); transition: opacity .2s;
  }
  .off img, .off .line, .off .detail { opacity: .2; text-shadow: none; }

  /* Text strip; on desktop it grows into the show detail panel */
  .strip { aspect-ratio: 4 / 1; padding: 6px 12px; display: grid; align-content: center; gap: 2px; }
  .unit > *, .strip > div { min-width: 0; }  /* long scrolling titles must not widen the page */
  .detail { display: none; }
  .line { font-family: var(--dot); white-space: nowrap; overflow: hidden; line-height: 1; transition: opacity .2s; }
  /* Scrolling text fades at the edges instead of being chopped mid-letter */
  .line.scroll { -webkit-mask-image: linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent);
                 mask-image: linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent); }
  .line.big { font-size: clamp(24px, 7.6vw, 32px); }
  .line.small { font-size: clamp(17px, 5vw, 21px); color: var(--amber-mid); }
  .line .run { display: inline-block; }
  .line.scroll .run { animation: marquee var(--dur, 12s) linear infinite; }
  @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }

  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tags span { font-family: var(--dot); font-size: 17px; padding: 0 6px; border: 1px solid var(--amber-dim); color: var(--amber-mid); }
  .desc {
    font-family: var(--dot); font-size: 21px; line-height: 1.15; color: var(--amber-mid);
    max-height: calc(21px * 1.15 * 6); overflow-y: auto; padding-right: 6px;
    scrollbar-width: thin; scrollbar-color: var(--amber-dim) transparent;
  }
  .prog { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; font-family: var(--dot); font-size: 19px; }
  .prog-bar { display: grid; grid-template-columns: repeat(30, 1fr); gap: 2px; height: 10px; }
  .prog-bar i { background: var(--amber-ghost); }
  .prog-bar i.lit { background: var(--amber); }
  .prog-left { color: var(--amber-dim); font-family: var(--dot); font-size: 17px; text-align: right; }

  /* Spectrum */
  .vis { display: grid; gap: 6px; }
  .vis-head { display: flex; justify-content: space-between; }
  .vis-src { font-family: var(--dot); font-size: 15px; color: var(--amber-dim); letter-spacing: .1em; }
  .vis canvas { width: 100%; height: 64px; display: block; }

  /* Volume: segmented bar with an invisible range input on top for touch and keys */
  .vol { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; }
  .bar { position: relative; height: 22px; display: grid; grid-template-columns: repeat(20, 1fr); gap: 3px; }
  .bar i { background: var(--amber-ghost); }
  .bar i.lit { background: var(--amber); box-shadow: 0 0 4px #ffb02e88; }
  .bar input { position: absolute; inset: -8px 0; width: 100%; height: calc(100% + 16px); opacity: 0; margin: 0; cursor: pointer; }
  .vol-read { font-family: var(--dot); font-size: 26px; min-width: 2.4ch; text-align: right; }

  /* Station board */
  .list { width: 100%; max-width: 420px; }
  .list-head {
    display: none; justify-content: space-between; font-family: var(--dot); font-size: 18px;
    letter-spacing: .08em; color: var(--amber-dim); border-bottom: 1px dashed var(--line);
    padding-bottom: 8px; margin: -4px 0 4px;
  }
  .cols { display: grid; gap: 14px; }
  .group h2 {
    margin: 0; padding: 6px 4px; font-family: var(--dot); font-weight: 400; font-size: 18px;
    letter-spacing: .1em; color: var(--amber-dim); border-bottom: 1px dashed var(--line);
  }
  .row {
    width: 100%; display: grid; grid-template-columns: 1.6ch 2.4ch minmax(0, 1fr); gap: 10px; align-items: baseline;
    text-align: left; padding: 6px 4px; font-family: var(--dot); font-size: 22px; color: var(--amber-mid);
  }
  .row .cur { color: var(--amber); visibility: hidden; }
  .row .n { color: var(--amber-dim); }
  .row .sub { display: block; font-size: 16px; color: var(--amber-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.1; }
  .row:hover { background: var(--amber-ghost); }
  .row.active { color: var(--amber); text-shadow: 0 0 6px #ffb02e88; }
  .row.active .cur { visibility: visible; }
  .row.active .n { color: var(--amber-mid); }
  .row.active .sub { color: var(--amber-mid); text-shadow: none; }

  /* Schedule and recently played: time column + text */
  .log { width: 100%; display: grid; grid-template-columns: 5ch minmax(0, 1fr); gap: 10px; align-items: baseline;
         text-align: left; padding: 5px 4px; font-family: var(--dot); font-size: 19px; color: var(--amber-mid); }
  .log .t { color: var(--amber-dim); }
  .log .x { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .log .x small { font-size: 16px; color: var(--amber-dim); }
  .log.now { color: var(--amber); }
  .log.now .t { color: var(--amber-mid); }
  button.log:hover { background: var(--amber-ghost); }
  .ch { padding: 8px 4px 2px; font-family: var(--dot); font-size: 16px; color: var(--amber-dim); letter-spacing: .1em; }
  .empty { padding: 8px 4px; font-family: var(--dot); font-size: 18px; color: var(--amber-dim); }

  .note {
    width: 100%; max-width: 420px; font-family: var(--dot); font-size: 17px; color: var(--amber-mid);
    border: 1px dashed var(--line); padding: 6px 10px; display: none;
  }
  .note.show { display: block; }
  .blink { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* Desktop: a wide now-playing deck above a station board */
  @media (min-width: 960px) {
    body { max-width: 1360px; margin: 0 auto; padding: 32px; align-items: stretch; }
    .note, .unit, .list { max-width: none; }
    .unit {
      grid-template-columns: minmax(220px, 24%) minmax(0, 1fr) 300px;
      grid-template-areas:
        "head head head"
        "art  info out"
        "art  info keys"
        "art  info dial"
        "art  info vol"
        "vis  vis  vis";
      column-gap: 24px; row-gap: 16px; padding: 20px;
    }
    .head { grid-area: head; }
    .mid { display: contents; }
    .art { grid-area: art; align-self: start; }
    .strip { grid-area: info; aspect-ratio: auto; padding: 18px 24px; align-content: space-between; gap: 14px; min-width: 0; }
    .detail { display: grid; gap: 12px; }
    .line.big { font-size: clamp(30px, 2.4vw, 36px); }
    .line.small { font-size: clamp(20px, 1.6vw, 24px); }
    .top { grid-area: keys; }
    .out { grid-area: out; }
    .dial-wrap { grid-area: dial; }
    .dial { max-width: 150px; }
    .vol { grid-area: vol; align-self: end; }
    .vis { grid-area: vis; }
    .vis canvas { height: 90px; }
    .list { border: 1px solid var(--line); padding: 16px 20px; }
    .list-head { display: flex; }
    .cols { grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 32px; row-gap: 20px; align-items: start; }
  }
  @media (min-width: 1280px) {
    .cols { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  }
</style>
</head>
<body>

<div class="note" id="note"></div>

<main class="unit" aria-label="Radio controls">
  <div class="head">
    <span>PI RADIO</span>
    <span class="sig" id="sig"></span>
    <span class="clock" id="clock"></span>
    <span id="status">--</span>
  </div>

  <div class="out">
    <span class="label">Output</span>
    <div class="seg" role="group" aria-label="Play on the radio or on this device">
      <button id="outRadio">RADIO</button>
      <button id="outPhone">THIS DEVICE</button>
    </div>
  </div>

  <div class="top">
    <button class="key" data-play="nts1" id="key-nts1" aria-label="Play NTS 1">NTS 1</button>
    <button class="key" data-play="nts2" id="key-nts2" aria-label="Play NTS 2">NTS 2</button>
    <div class="seg" role="group" aria-label="Play or stop">
      <button id="btnPlay" aria-label="Play">PLAY</button>
      <button id="btnStop" aria-label="Stop">STOP</button>
    </div>
  </div>

  <div class="mid">
    <div class="dial-wrap">
      <div class="dial" id="dial" role="slider" tabindex="0" aria-label="Station dial. Turn to change station, press to play or stop">
        <div class="dial-read"><b class="glow" id="dialNum">--</b><span id="dialOf">/--</span></div>
      </div>
      <span class="label">Turn · Press</span>
    </div>
    <div class="screen art off" id="artScreen">
      <img id="art" alt="" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==">
    </div>
  </div>

  <div class="screen strip off" id="strip">
    <div class="detail">
      <div class="tags" id="tags"></div>
      <div class="desc" id="desc"></div>
      <div class="prog" id="prog" hidden>
        <span id="progStart"></span>
        <div class="prog-bar" id="progBar"></div>
        <span id="progEnd"></span>
      </div>
      <div class="prog-left" id="progLeft"></div>
    </div>
    <div>
      <div class="line big glow" id="line1"><span class="run">—</span></div>
      <div class="line small" id="line2"><span class="run"></span></div>
    </div>
  </div>

  <div class="vis">
    <div class="vis-head"><span class="label">Spectrum</span><span class="vis-src" id="visSrc"></span></div>
    <canvas id="vis" aria-hidden="true"></canvas>
  </div>

  <div class="vol">
    <span class="label">Vol</span>
    <div class="bar" id="bar"><input type="range" id="vol" min="0" max="100" step="5" aria-label="Volume"></div>
    <span class="vol-read glow" id="volRead">--</span>
  </div>
</main>

<nav class="list" aria-label="Stations">
  <div class="list-head"><span>STATIONS</span><span id="listCount">--</span></div>
  <div class="cols">
    <div id="colLive"></div>
    <div id="colMix"></div>
    <div id="colElse"></div>
    <div>
      <section class="group"><h2>RECENTLY PLAYED</h2><div id="recent"></div></section>
    </div>
  </div>
</nav>

<!-- static-flag -->
<script>
const $ = (id) => document.getElementById(id);
let S = null;            // last state from the server
let order = [];          // flat station ids in dial order
let volDragging = false;
let schedule = {};
const pad = (n) => String(n).padStart(2, "0");
const hhmm = (iso) => new Date(iso).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: false });
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* No-server mode. The static build (build_static.py) sets PI_RADIO_STATIC: the page reads
   stations.json, fetches NTS's public feeds itself, dithers art in the browser, plays every
   stream on this device, and keeps Recently played on this device. */
const STATIC = !!window.PI_RADIO_STATIC;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (_) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} },
};

const ntsFeed = (() => {
  const cache = {};
  async function get(url, ttl) {
    const c = cache[url];
    if (c && Date.now() - c.at < ttl) return c.data;
    try {
      const d = await (await fetch(url)).json();
      cache[url] = { at: Date.now(), data: d };
      return d;
    } catch (_) { return c ? c.data : {}; }  // keep the last good copy
  }
  const unescape = (t) => { const el = document.createElement("textarea"); el.innerHTML = t || ""; return el.value.trim(); };
  const show = (b) => {
    const det = (b.embeds || {}).details || {};
    return {
      title: unescape(b.broadcast_title), subtitle: det.location_long || "",
      description: unescape(det.description), genres: (det.genres || []).map(g => g.value).filter(Boolean),
      start: b.start_timestamp, end: b.end_timestamp, art: (det.media || {}).picture_medium || "",
    };
  };
  return {
    async schedule(ch, count = 5) {
      const d = await get("https://www.nts.live/api/v2/live", 60000);
      const c = (d.results || []).find(r => r.channel_name === ch) || {};
      // NTS keeps listing a show as "now" for a while after it ends; skip anything already over.
      const t = Date.now();
      return ["now", "next", ...Array.from({ length: 16 }, (_, i) => `next${i + 2}`)]
        .filter(k => c[k]).map(k => show(c[k]))
        .filter(x => !x.end || new Date(x.end) > t).slice(0, count);
    },
    async mixtape(alias) {
      const d = await get("https://www.nts.live/api/v2/mixtapes", 6 * 3600e3);
      const m = (d.results || []).find(r => r.mixtape_alias === alias);
      return m ? { title: m.title, subtitle: m.subtitle || "", description: unescape(m.description), art: (m.media || {}).picture_medium || "" } : {};
    },
  };
})();

let STN = {};  // static mode: station id -> full station record from stations.json

/* Where the page gets its data: the server, or (static) NTS and stations.json directly. */
const DATA = {
  async stations() {
    if (!STATIC) return (await fetch("/api/stations")).json();
    const { groups } = await (await fetch("stations.json")).json();
    for (const g of groups) for (const st of g.stations) {
      STN[st.id] = { ...st, group: g.name };
      st.sub = st.kind === "radio" ? st.place || "" : st.kind === "nts_mixtape" ? (await ntsFeed.mixtape(st.id)).subtitle || "" : "";
    }
    return groups;
  },
  async now(id) {
    if (!STATIC) return api(`/api/now/${id}`);
    const st = STN[id];
    if (!st) return null;
    let now = { title: "", subtitle: st.place || "", description: st.about || "", art: st.art || "" };
    if (st.kind === "nts_live") now = (await ntsFeed.schedule(st.channel, 1))[0] || now;
    if (st.kind === "nts_mixtape") {
      const m = await ntsFeed.mixtape(id);
      now = { title: m.subtitle || "", subtitle: "Infinite Mixtape", description: m.description || "", art: m.art || "" };
    }
    const codec = /\.m3u8/.test(st.url) ? "HLS" : /aac/i.test(st.url) ? "AAC" : /mp3|mpeg/i.test(st.url) ? "MP3" : "";
    return {
      station: { id, name: st.name, group: st.group, url: st.url },
      now: { genres: [], description: "", start: null, end: null, ...now },
      signal: { codec }, art: now.art || "name:" + st.name, artSrc: now.art || "",
    };
  },
  async schedule() {
    if (!STATIC) return api("/api/schedule");
    const [a, b] = await Promise.all([ntsFeed.schedule("1"), ntsFeed.schedule("2")]);
    return { "NTS 1": a, "NTS 2": b };
  },
  async history() { return STATIC ? store.get("piRadioHistory", []) : api("/api/history"); },
};

/* Static mode logs Recently played on this device, the same way the server does for the radio. */
function logLocalHistory() {
  if (!STATIC || !local.playing || !local.desc) return;
  const h = store.get("piRadioHistory", []);
  const entry = { at: new Date().toISOString(), station: local.desc.station.name, title: local.desc.now.title || "" };
  if (h[0] && h[0].station === entry.station && h[0].title === entry.title) return;
  store.set("piRadioHistory", [entry, ...h].slice(0, 50));
  loadRecent();
}

/* Dithers art to 128x128 1-bit amber in the browser, matching art.py on the server. */
const artCache = {};
function loadImage(url) {
  return new Promise((ok, fail) => {
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => ok(img); img.onerror = fail;
    img.src = url;
  });
}
/* Cover art as an amber halftone: one dot per cell on a 45° grid, dot area tracking brightness
   (midtones eased darker so highlights stay separate dots). Station names with no usable art
   become block letters. Same treatment as art.py, so both versions match. */
const ART_N = 128, ART_OUT = 512, HT_CELLS = 32, HT_ANGLE = 45, HT_GAMMA = 1.2;
function halftoneCanvas(gray) {
  const N = ART_N, c = document.createElement("canvas");
  c.width = c.height = ART_OUT;
  const g = c.getContext("2d"), pitch = N / HT_CELLS, k = ART_OUT / N;
  const a = HT_ANGLE * Math.PI / 180, ca = Math.cos(a), sa = Math.sin(a), span = Math.ceil(HT_CELLS * 0.75) + 1;
  const at = (x, y) => gray[Math.min(N - 1, Math.max(0, y)) * N + Math.min(N - 1, Math.max(0, x))];
  g.fillStyle = "#ffb02e";
  for (let j = -span; j < span; j++) for (let i = -span; i < span; i++) {
    const u = (i + .5) * pitch, v = (j + .5) * pitch;
    const x = N / 2 + u * ca - v * sa, y = N / 2 + u * sa + v * ca;
    if (x < -pitch || y < -pitch || x > N + pitch || y > N + pitch) continue;
    const x0 = Math.round(x - pitch / 2), y0 = Math.round(y - pitch / 2), w = Math.round(pitch);
    let sum = 0;
    for (let yy = y0; yy < y0 + w; yy++) for (let xx = x0; xx < x0 + w; xx++) sum += at(xx, yy);
    const r = pitch / 2 * Math.sqrt(Math.pow(sum / (w * w) / 255, HT_GAMMA)) * 0.98 * k;
    if (r < 0.4) continue;
    g.beginPath(); g.arc(x * k, y * k, r, 0, Math.PI * 2); g.fill();
  }
  return c;
}
async function ditherArt(url, name) {
  const key = url || "name:" + name;
  if (artCache[key]) return artCache[key];
  if (url && url.startsWith("art/")) return url;  // pre-rendered by build_static.py
  const N = ART_N, c = document.createElement("canvas");
  c.width = c.height = N;
  const g = c.getContext("2d", { willReadFrequently: true });
  let px = null;
  if (url) {
    try {
      const img = await loadImage(url);
      const k = Math.max(N / img.width, N / img.height);
      g.drawImage(img, (N - img.width * k) / 2, (N - img.height * k) / 2, img.width * k, img.height * k);
      px = g.getImageData(0, 0, N, N);  // throws if the image host blocks it
    } catch (_) { px = null; }
  }
  if (px) {
    const d = px.data, gray = new Float32Array(N * N);
    for (let i = 0; i < N * N; i++) gray[i] = (0.299 * d[i * 4] + 0.587 * d[i * 4 + 1] + 0.114 * d[i * 4 + 2]) * d[i * 4 + 3] / 255;
    // Stretch contrast, ignoring the extreme 1% each end.
    const sorted = Float32Array.from(gray).sort();
    const lo = sorted[Math.floor(N * N * 0.01)], hi = sorted[Math.floor(N * N * 0.99)];
    if (hi > lo) for (let i = 0; i < N * N; i++) gray[i] = Math.min(255, Math.max(0, (gray[i] - lo) * 255 / (hi - lo)));
    return (artCache[key] = halftoneCanvas(gray).toDataURL());
  }
  // Station name in block letters, for stations with no usable art.
  if (document.fonts) await document.fonts.ready;
  const out = document.createElement("canvas");
  out.width = out.height = ART_OUT;
  const o = out.getContext("2d"), s = ART_OUT / N;
  o.fillStyle = "#ffb02e"; o.strokeStyle = "#ffb02e"; o.lineWidth = s;
  o.strokeRect(2.5 * s, 2.5 * s, (N - 5) * s, (N - 5) * s);
  o.font = `${26 * s}px VT323, monospace`; o.textAlign = "center"; o.textBaseline = "middle";
  const words = name.toUpperCase().split(" ");
  const lines = words.length <= 3 ? words : [words.slice(0, 2).join(" "), words.slice(2).join(" ")];
  lines.forEach((l, i) => o.fillText(l, ART_OUT / 2, ART_OUT / 2 + (i - (lines.length - 1) / 2) * 26 * s));
  return (artCache[key] = out.toDataURL());
}
function setArt(img, s) {
  if (!STATIC) { img.src = s.art; return; }
  const key = s.art;
  ditherArt(s.artSrc, s.station.name).then(u => { if (img.dataset.src === key) img.src = u; });
}

async function api(path, body) {
  const get = body === undefined && !/^\/api\/(play|toggle|stop|step|volume)\b/.test(path);
  const opts = get ? {} : body === undefined ? { method: "POST" } :
    { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) };
  try {
    const r = await fetch(path, opts);
    if (!r.ok) throw new Error(r.status);
    return await r.json();
  } catch (e) { setNote("NO SIGNAL FROM RADIO. RETRYING<span class='blink'>_</span>"); return null; }
}

function setNote(html) {
  const n = $("note");
  n.innerHTML = html || "";
  n.classList.toggle("show", !!html);
}

/* Output mode. "radio" drives the speakers at home through the server.
   "phone" plays the stream on this device and only asks the server what's on. */
let mode = "radio";
try { mode = localStorage.getItem("piRadioOutput") || "radio"; } catch (_) {}
if (STATIC) mode = "phone";
const URLS = {}, NAMES = {};   // station id -> stream URL, display name
const audio = new Audio();
audio.preload = "none";
const local = { id: null, playing: false, volume: 80, desc: null };
let hls = null;
// iPhones only allow the hardware buttons to set volume; detect that so the bar can say so.
const canSetVolume = (() => { const a = new Audio(); a.volume = 0.5; return a.volume === 0.5; })();
const needsHlsJs = !audio.canPlayType("application/vnd.apple.mpegurl");
let hlsLoading = null;

function loadHlsJs() {
  // Safari plays HLS (The Lot Radio) natively; other browsers need hls.js.
  if (!needsHlsJs || window.Hls) return Promise.resolve();
  return hlsLoading ||= new Promise((ok, fail) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js";
    s.onload = ok; s.onerror = fail;
    document.head.appendChild(s);
  });
}

function phoneRender() {
  if (!local.desc) return;
  render({ ...local.desc, playing: local.playing, volume: canSetVolume ? local.volume : null, player: "phone" });
}

async function phoneDescribe() {
  if (!local.id) return;
  const d = await DATA.now(local.id);
  if (d && d.station.id === local.id) { local.desc = d; phoneRender(); }
}

async function phonePlay(id) {
  if (hls) { hls.destroy(); hls = null; }
  local.id = id;
  store.set("piRadioLast", id);
  const url = URLS[id];
  // Start playback inside the tap: iPhones block audio that starts later.
  if (url.includes(".m3u8") && needsHlsJs) {
    await loadHlsJs();
    hls = new Hls();
    hls.loadSource(url);
    hls.attachMedia(audio);
  } else {
    audio.src = url;
  }
  audio.volume = local.volume / 100;
  local.playing = true;
  audio.play().catch(() => setNote("TAP PLAY TO START AUDIO ON THIS DEVICE."));
  local.desc = local.desc && local.desc.station.id === id ? local.desc :
    { ...(local.desc || {}), station: { id, name: NAMES[id] || id, group: "" }, now: { title: "", subtitle: "" }, signal: {},
      art: STATIC ? "name:" + (NAMES[id] || id) : `/api/art/${id}`, artSrc: "" };
  phoneRender();
  phoneDescribe();
}

function phoneStop() {
  if (hls) { hls.destroy(); hls = null; }
  audio.pause();
  audio.removeAttribute("src");
  audio.load();  // stops the download, not just the sound
  local.playing = false;
  phoneRender();
}

audio.addEventListener("playing", () => setNote(""));
audio.addEventListener("error", () => {
  if (!local.playing) return;
  local.playing = false;
  setNote("STREAM FAILED ON THIS DEVICE. TRY ANOTHER STATION.");
  phoneRender();
});

// Lock-screen and headphone controls.
if ("mediaSession" in navigator) {
  const ms = navigator.mediaSession;
  ms.setActionHandler("play", () => { if (mode === "phone" && !local.playing) act.toggle(); });
  ms.setActionHandler("pause", () => { if (mode === "phone") act.stop(); });
  ms.setActionHandler("stop", () => { if (mode === "phone") act.stop(); });
  ms.setActionHandler("nexttrack", () => { if (mode === "phone") act.step(1); });
  ms.setActionHandler("previoustrack", () => { if (mode === "phone") act.step(-1); });
}
function mediaMeta(s) {
  if (!("mediaSession" in navigator) || s.player !== "phone") return;
  navigator.mediaSession.metadata = new MediaMetadata({
    title: s.now.title || s.station.name, artist: s.station.name, album: "Pi Radio",
    artwork: STATIC ? (s.artSrc ? [{ src: s.artSrc, sizes: "400x400" }] : [])
      : [{ src: new URL(s.art, location.href).href, sizes: "128x128", type: "image/png" }],
  });
  navigator.mediaSession.playbackState = s.playing ? "playing" : "paused";
}

/* Every control goes through here, so each one works in both output modes. */
const act = {
  play: (id) => mode === "phone" ? phonePlay(id) : api(`/api/play/${id}`).then(render),
  toggle: () => mode === "phone"
    ? (local.playing ? phoneStop() : phonePlay(local.id || (S && S.station.id) || order[0]))
    : api("/api/toggle").then(render),
  stop: () => mode === "phone" ? phoneStop() : api("/api/stop").then(render),
  step: (dir) => {
    if (mode !== "phone") return api(`/api/step/${dir}`).then(render);
    const cur = order.indexOf(local.id || (S && S.station.id));
    return phonePlay(order[(cur + dir + order.length) % order.length]);
  },
  volume: (v) => {
    if (mode !== "phone") return api("/api/volume", { value: v }).then(render);
    local.volume = v; audio.volume = v / 100; phoneRender();
  },
};

function setMode(m) {
  if (m === mode) return;
  if (m === "radio") phoneStop();
  else if (S) { local.id = local.id || S.station.id; local.desc = local.desc || { ...S }; }
  mode = m;
  try { localStorage.setItem("piRadioOutput", m); } catch (_) {}
  drawMode();
  poll();
}
function drawMode() {
  document.body.classList.toggle("static", STATIC);
  $("outRadio").classList.toggle("on", mode === "radio");
  $("outPhone").classList.toggle("on", mode === "phone");
  if (mode === "phone" && needsHlsJs) loadHlsJs().catch(() => {});
}

function setLine(el, text) {
  const run = el.querySelector(".run");
  if (run.dataset.text === text) return;
  run.dataset.text = text;
  el.classList.remove("scroll");
  run.textContent = text;
  requestAnimationFrame(() => {
    if (run.scrollWidth > el.clientWidth) {
      // Duplicate the text so the loop is seamless, speed scaled to length.
      const gap = "   ·   ";
      run.textContent = text + gap + text + gap;
      el.style.setProperty("--dur", Math.max(8, text.length * 0.35) + "s");
      el.classList.add("scroll");
    }
  });
}

function drawVolume(v) {
  const lit = v === null ? 0 : Math.round(v / 5);
  [...$("bar").querySelectorAll("i")].forEach((c, i) => c.classList.toggle("lit", i < lit));
  $("volRead").textContent = v === null ? "--" : pad(Math.min(v, 99));
}

function drawSignal(sig, playing) {
  if (!playing) { $("sig").textContent = ""; return; }
  const parts = [sig.codec, sig.kbps && sig.kbps + "K", sig.khz && sig.khz + "KHZ", sig.channels && (sig.channels > 1 ? "ST" : "MONO")];
  $("sig").textContent = parts.filter(Boolean).join(" · ") || "";
}

function drawDetail(now) {
  $("tags").innerHTML = (now.genres || []).slice(0, 5).map(g => `<span>${esc(g.toUpperCase())}</span>`).join("");
  $("desc").textContent = now.description || "";
  drawProgress(now);
}

/* How far through the current NTS show. Redrawn every 10 s by tick(), not only on new data. */
function drawProgress(now) {
  const has = now.start && now.end;
  $("prog").hidden = !has;
  if (!has) { $("progLeft").textContent = ""; return; }
  const a = new Date(now.start), b = new Date(now.end), t = Date.now();
  const frac = Math.min(1, Math.max(0, (t - a) / (b - a)));
  $("progStart").textContent = hhmm(now.start);
  $("progEnd").textContent = hhmm(now.end);
  const lit = Math.round(frac * 30);
  [...$("progBar").children].forEach((c, i) => c.classList.toggle("lit", i < lit));
  const left = Math.max(0, Math.round((b - t) / 60000));
  $("progLeft").textContent = left > 0 ? left + " MIN LEFT" : "ENDING";
}

function render(s) {
  if (!s) return;
  S = s;
  if (drag) return;  // mid-turn on the dial; release repaints
  if (s.player !== "phone") setNote(s.player === "mock" ? "MOCK PLAYER: NO SOUND. START MPD OR RUN ON THE PI." : "");
  mediaMeta(s);

  const on = s.playing, id = s.station.id;
  $("status").textContent = on ? (s.player === "phone" && !STATIC ? "● ON DEVICE" : "● ON AIR") : "○ STANDBY";
  $("status").className = on ? "glow" : "";
  $("btnPlay").classList.toggle("on", on);
  $("btnStop").classList.toggle("on", !on);
  $("artScreen").classList.toggle("off", !on);
  $("strip").classList.toggle("off", !on);
  $("key-nts1").classList.toggle("on", on && id === "nts1");
  $("key-nts2").classList.toggle("on", on && id === "nts2");

  const title = [s.station.name, s.now.title].filter(Boolean).join(" · ");
  setLine($("line1"), title.toUpperCase());
  setLine($("line2"), (s.now.subtitle || s.station.group).toUpperCase());
  drawDetail(s.now);
  drawSignal(s.signal, on);

  const img = $("art");
  if (img.dataset.src !== s.art) { img.dataset.src = s.art; setArt(img, s); }

  const idx = order.indexOf(id);
  $("dialNum").textContent = idx >= 0 ? pad(idx + 1) : "--";
  [...$("dial").querySelectorAll("i")].forEach((d, i) => {
    const dist = Math.min(Math.abs(i - idx), order.length - Math.abs(i - idx));
    d.className = i === idx ? "lit" : dist === 1 ? "near" : "";
  });

  if (!volDragging) {
    $("vol").disabled = s.volume === null;
    if (s.volume !== null) $("vol").value = s.volume;
    drawVolume(s.volume);
  }

  document.querySelectorAll(".row").forEach(r => r.classList.toggle("active", r.dataset.id === id));
}

function stationGroup(g, startN) {
  const sec = document.createElement("section");
  sec.className = "group";
  sec.innerHTML = `<h2>${esc(g.name.toUpperCase())}</h2>`;
  g.stations.forEach((st, i) => {
    order.push(st.id);
    URLS[st.id] = st.url; NAMES[st.id] = st.name;
    const b = document.createElement("button");
    b.className = "row"; b.dataset.id = st.id;
    b.innerHTML = `<span class="cur">&gt;</span><span class="n">${pad(startN + i)}</span>` +
      `<span>${esc(st.name.toUpperCase())}<span class="sub" data-sub="${st.id}">${esc(st.sub)}</span></span>`;
    b.onclick = () => act.play(st.id);
    sec.appendChild(b);
  });
  return sec;
}

async function build() {
  const groups = await DATA.stations();
  const cols = [$("colLive"), $("colMix"), $("colElse")];
  let n = 1;
  groups.forEach((g, i) => {
    cols[Math.min(i, cols.length - 1)].appendChild(stationGroup(g, n));
    n += g.stations.length;
  });
  // NTS schedule sits under the NTS Live group.
  const sch = document.createElement("section");
  sch.className = "group"; sch.style.marginTop = "14px";
  sch.innerHTML = `<h2>NTS SCHEDULE</h2><div id="sched"></div>`;
  $("colLive").appendChild(sch);

  $("dialOf").textContent = "/" + pad(order.length);
  $("listCount").textContent = pad(order.length);

  // One square per station around the dial, like an LED ring.
  order.forEach((_, i) => {
    const d = document.createElement("i");
    const a = (i / order.length) * 360 - 90;
    d.style.transform = `rotate(${a}deg) translateX(min(72px, 21vw)) rotate(${-a}deg)`;
    $("dial").appendChild(d);
  });
  for (let i = 0; i < 20; i++) $("bar").insertBefore(document.createElement("i"), $("vol"));
  for (let i = 0; i < 30; i++) $("progBar").appendChild(document.createElement("i"));
}

async function loadSchedule() {
  const d = await DATA.schedule();
  if (!d) return;
  schedule = d;
  const ids = { "NTS 1": "nts1", "NTS 2": "nts2" };
  let html = "";
  for (const [ch, shows] of Object.entries(d)) {
    html += `<div class="ch">${ch}</div>`;
    shows.slice(0, 4).forEach((s, i) => {
      html += `<button class="log${i === 0 ? " now" : ""}" data-ch="${ids[ch]}"><span class="t">${i === 0 ? "NOW" : hhmm(s.start)}</span>` +
        `<span class="x">${esc(s.title.toUpperCase())}</span></button>`;
    });
    const sub = document.querySelector(`[data-sub="${ids[ch]}"]`);
    if (sub && shows[0]) sub.textContent = shows[0].title.toUpperCase();
  }
  $("sched").innerHTML = html || `<div class="empty">NO SCHEDULE</div>`;
  $("sched").querySelectorAll("[data-ch]").forEach(b => b.onclick = () => act.play(b.dataset.ch));
}

async function loadRecent() {
  const d = await DATA.history();
  if (!d) return;
  $("recent").innerHTML = d.length ? d.slice(0, 12).map(h =>
    `<div class="log"><span class="t">${hhmm(h.at)}</span><span class="x">${esc(h.station.toUpperCase())}` +
    (h.title ? `<br><small>${esc(h.title.toUpperCase())}</small>` : "") + `</span></div>`).join("")
    : `<div class="empty">NOTHING YET</div>`;
}

/* Clock */
function tick() {
  const d = new Date();
  $("clock").innerHTML = `${pad(d.getHours())}<i>:</i>${pad(d.getMinutes())}`;
  if (d.getSeconds() % 10 === 0 && S && S.now && !drag) drawProgress(S.now);
}

/* Keys and play/stop */
document.querySelectorAll("[data-play]").forEach(b =>
  b.addEventListener("click", () => act.play(b.dataset.play)));
$("btnPlay").addEventListener("click", () => { if (!S || !S.playing) act.toggle(); });
$("btnStop").addEventListener("click", () => act.stop());
$("outRadio").addEventListener("click", () => setMode("radio"));
$("outPhone").addEventListener("click", () => setMode("phone"));

/* Dial: drag round to pick a station (one step per 24°), release to play it; tap to play/stop.
   While dragging only the dial and the station name move. Nothing plays until release, so the
   keys above stay put, and the phone starts audio inside the release gesture as Safari requires. */
const STEP_DEG = 24;
var drag = null;  // var: render() checks it and can run before this line
function dialGeom(e) {
  const r = $("dial").getBoundingClientRect();
  const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
  return { angle: Math.atan2(dy, dx) * 180 / Math.PI, dist: Math.hypot(dx, dy), radius: r.width / 2 };
}
function currentIndex() {
  return order.indexOf((mode === "phone" && local.id) || (S && S.station.id));
}
function previewDial(idx) {
  $("dialNum").textContent = pad(idx + 1);
  [...$("dial").querySelectorAll("i")].forEach((d, i) => {
    const dist = Math.min(Math.abs(i - idx), order.length - Math.abs(i - idx));
    d.className = i === idx ? "lit" : dist === 1 ? "near" : "";
  });
  setLine($("line1"), (NAMES[order[idx]] || order[idx]).toUpperCase());
  setLine($("line2"), "RELEASE TO TUNE");
}
$("dial").addEventListener("pointerdown", e => {
  if (e.button > 0) return;
  e.preventDefault();  // no text selection or focus jumps while dragging with a mouse
  const g = dialGeom(e);
  drag = { last: g.angle, acc: 0, x: e.clientX, y: e.clientY, moved: false, idx: currentIndex(), start: currentIndex() };
  try { $("dial").setPointerCapture(e.pointerId); } catch (_) {}
});
$("dial").addEventListener("pointermove", e => {
  if (!drag) return;
  e.preventDefault();
  const g = dialGeom(e);
  if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 8) drag.moved = true;
  // Near the centre a tiny finger movement is a huge angle; ignore it there.
  if (g.dist < g.radius * 0.3) { drag.last = g.angle; return; }
  let d = g.angle - drag.last;
  if (d > 180) d -= 360;
  if (d < -180) d += 360;
  drag.last = g.angle;
  if (!drag.moved) return;
  drag.acc += d;
  while (Math.abs(drag.acc) >= STEP_DEG) {
    const dir = drag.acc > 0 ? 1 : -1;
    drag.acc -= dir * STEP_DEG;
    drag.idx = ((drag.idx < 0 ? 0 : drag.idx) + dir + order.length) % order.length;
    if (navigator.vibrate) navigator.vibrate(6);
    previewDial(drag.idx);
  }
});
$("dial").addEventListener("pointerup", () => {
  if (!drag) return;
  const d = drag; drag = null;
  if (!d.moved) act.toggle();
  else if (d.idx !== d.start && d.idx >= 0) act.play(order[d.idx]);
  else if (S) render(S);  // turned and came back: restore the display
});
$("dial").addEventListener("pointercancel", () => { drag = null; if (S) render(S); });
$("dial").addEventListener("keydown", e => {
  const dir = e.key === "ArrowRight" || e.key === "ArrowUp" ? 1 : e.key === "ArrowLeft" || e.key === "ArrowDown" ? -1 : 0;
  if (dir) { e.preventDefault(); const i = currentIndex(); act.play(order[((i < 0 ? 0 : i) + dir + order.length) % order.length]); }
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); act.toggle(); }
});

/* Volume: update the bar live, send after a short pause. */
let volTimer;
$("vol").addEventListener("input", e => {
  volDragging = true;
  drawVolume(+e.target.value);
  clearTimeout(volTimer);
  volTimer = setTimeout(async () => { await act.volume(+e.target.value); volDragging = false; }, 150);
});

/* Spectrum: real levels from MPD when it's there; otherwise a simulation, labelled SIM. */
const BANDS = 32, CELLS = 14;
let visLevels = new Array(BANDS).fill(0), visSource = "none", visLast = 0, visChecked = 0;
function simLevels(t) {
  return visLevels.map((v, i) => {
    const x = i / BANDS;
    const base = 0.75 - x * 0.45;                       // more energy in the low end, like music
    const wob = Math.sin(t / 180 + i * 0.9) * 0.18 + Math.sin(t / 97 + i * 2.3) * 0.12;
    const hit = (Math.sin(t / 240) > 0.6 && i < 6) ? 0.25 : 0; // a kick now and then
    const target = Math.max(0, Math.min(1, base + wob + hit + (Math.random() - 0.5) * 0.15));
    return target > v ? target : v * 0.86;
  });
}
function drawVis() {
  const c = $("vis"), dpr = window.devicePixelRatio || 1;
  const w = c.clientWidth, h = c.clientHeight;
  if (c.width !== w * dpr || c.height !== h * dpr) { c.width = w * dpr; c.height = h * dpr; }
  const g = c.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);
  const gap = 3, bw = (w - gap * (BANDS - 1)) / BANDS, ch = (h - gap * (CELLS - 1)) / CELLS;
  for (let i = 0; i < BANDS; i++) {
    const lit = Math.round(visLevels[i] * CELLS);
    for (let j = 0; j < CELLS; j++) {
      g.fillStyle = j < lit ? (j >= CELLS - 2 ? "#ffd27a" : "#ffb02e") : "#241907";
      g.fillRect(i * (bw + gap), h - (j + 1) * ch - j * gap, bw, ch);
    }
  }
}
async function visLoop(t) {
  const playing = S && S.playing && !document.hidden;
  if (!playing) {
    visLevels = visLevels.map(v => v * 0.8);
  } else if (visSource === "mpd" && S.player !== "phone") {
    if (t - visLast > 66) {            // ~15 updates a second
      visLast = t;
      const d = await api("/api/spectrum");
      if (d) { visSource = d.source; visLevels = d.levels; }
    }
  } else {
    visLevels = simLevels(t);
    if (t - visChecked > 5000) {       // look for MPD's feed every few seconds
      visChecked = t;
      if (!STATIC) api("/api/spectrum").then(d => { if (d) visSource = d.source; });
    }
  }
  $("visSrc").textContent = !playing ? "" : visSource === "mpd" && S.player !== "phone" ? "LIVE" : "SIM";
  drawVis();
  requestAnimationFrame(visLoop);
}

/* Poll so the app follows the physical controls and show changes. */
async function poll() {
  if (mode === "phone") return phoneDescribe();
  render(await api("/api/state"));
}
build().then(async () => {
  drawMode();
  if (STATIC) {
    // Start on the last station played here, stopped, until a station is tapped.
    local.id = store.get("piRadioLast", order[0]);
    if (!URLS[local.id]) local.id = order[0];
    local.desc = await DATA.now(local.id);
    phoneRender();
    setInterval(logLocalHistory, 15000);
  } else if (mode === "phone") {
    // Start from whatever the radio was last on, stopped, until a station is tapped.
    const s = await api("/api/state");
    if (s) { local.id = s.station.id; local.desc = s; phoneRender(); }
  } else poll();
  loadSchedule(); loadRecent(); requestAnimationFrame(visLoop);
});
tick();
setInterval(tick, 1000);
setInterval(poll, 3000);
setInterval(loadSchedule, 60000);
setInterval(loadRecent, 15000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) { poll(); loadRecent(); } });
</script>
</body>
</html>
