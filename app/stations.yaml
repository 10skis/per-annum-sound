# Station list for Pi Radio. Order here is the order the dial steps through.
# kinds:
#   nts_live     NTS Channel 1/2. Show info and art come from the NTS live feed.
#   nts_mixtape  NTS Infinite Mixtape. Title and art come from the NTS mixtapes feed by alias.
#   radio        Any other stream. Track info comes from the stream itself (ICY metadata), or
#                in the browser from the station's own feed where it allows that (info:).
# info: kexp | airtime:<subdomain> | radioco:<station id> | radiocult:<station slug>
# genre: shown with the place under the station's name in the list.
# Stream URLs checked 2026-11-02 (Kool FM, WQXR and Chillhop added the same day). Find more at https://www.radio-browser.info

# Where stations broadcast from, for the map: [lat, lon], plus an optional map label.
# A station can also set map: [lat, lon, label] to be pinned somewhere other than its place.
# Places that share a label sit on one marker. Stations take their group's place unless set;
# a place not listed here (e.g. "Online") keeps the station off the map.
