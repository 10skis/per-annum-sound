# MPD config for running Pi Radio on a Mac. Start with:  mpd dev/mpd.conf   (from the app folder)
# Stop with:  mpd --kill dev/mpd.conf
# On the Pi, moOde runs its own MPD and this file isn't used.
bind_to_address "localhost"
port            "6600"
pid_file        "/tmp/pi-radio-mpd.pid"
state_file      "/tmp/pi-radio-mpd.state"
audio_output {
    type        "osx"
    name        "Mac speakers"
    mixer_type  "software"
}
